name: Feature request
description: Suggest an idea or improvement for SkySim.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
      placeholder: I want to test my controller in gusty wind, but...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How you'd like it to work. Rough ideas are fine.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Physics / aerodynamics
        - Sensors
        - Browser demo (web/)
        - Godot desktop (demo/)
        - Python environment / RL
        - SITL / HITL bridges
        - Docs
        - Build / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, or how you work around it today.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
