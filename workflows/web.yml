name: Deploy web

# Builds the WebAssembly core and publishes web/ to GitHub Pages, as described
# in web/README.md. Enable Pages once: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Build the WASM core
        run: ./web/build_wasm.sh
      - name: Stage the site (wasm next to index.html)
        run: cp web/public/skysim_core.* web/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
